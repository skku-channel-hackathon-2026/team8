<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>타공사</title>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
    <script>
      // 채널톡 밖(로컬 미리보기)에서는 ChannelIOWam이 없으므로 확인 후 사용한다.
      try {
        var dark =
          window.ChannelIOWam &&
          window.ChannelIOWam.getWamData('appearance') === 'dark'
        document.body.style.backgroundColor = dark ? '#1B1916' : '#F5F0E6'
      } catch (error) {
        document.body.style.backgroundColor = '#F5F0E6'
      }
    </script>
  </body>
</html>
